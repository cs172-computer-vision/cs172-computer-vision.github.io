<section class="slide" id="06-hinge" aria-label="6. Hinge loss charges margin violations"><h1>Hinge loss charges margin violations</h1><div class="content"><div class="cols "><div><figure class=""><img src="assets/hinge.svg" alt="Hinge loss max of zero and one minus score gap, with a kink at gap one"></figure></div><div><p>For one competing class, define the score gap <m>m=s_{y_i}-s_j</m>.</p><m display="true">\ell(m)=\max(0,1-m)</m><div class="step" data-stage="1"><p>Gap <m>\ge 1</m>: no penalty.<br>Gap <m><1</m>: a linear penalty.</p><p class="small muted">A correct prediction can still have positive loss.</p></div></div></div></div><footer><span><a href="https://cs231n.github.io/linear-classify/" target="_blank" rel="noopener">CS231n · course notes</a></span><span>Loss and SVM</span><span>06 / TOTAL</span></footer></section>
