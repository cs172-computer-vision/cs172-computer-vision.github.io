<section class="slide" id="38-xor" aria-label="38. Two ReLU features can solve XOR"><h1>Two ReLU features can solve XOR</h1><div class="content"><div class="cols "><div><div class="visual" data-demo="xor"></div></div><div><div class="demo-controls"><label>Representation<select aria-label="XOR representation" data-control="xor"><option value="input">Input coordinates (x₁, x₂)</option><option value="hidden">Hidden coordinates (h₁, h₂)</option></select></label><p><m>h_1=\max(0,x_1-x_2)</m><br><m>h_2=\max(0,x_2-x_1)</m></p><p>Class 1 score: <m>s_1=h_1+h_2</m>.<br>Class 0 score: <m>s_0=0.5</m>.</p><button data-reset="xor">Reset</button><p class="small">The input points (0,0) and (1,1) coincide at hidden point (0,0).</p></div></div></div></div><footer><span><a href="https://cs231n.stanford.edu/slides/2026/lecture_4.pdf" target="_blank" rel="noopener">CS231n · Lecture 4 · pp. 16–18</a></span><span>Neural networks</span><span>38 / TOTAL</span></footer></section>
