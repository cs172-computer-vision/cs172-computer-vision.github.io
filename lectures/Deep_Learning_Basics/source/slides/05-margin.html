<section class="slide" id="05-margin" aria-label="5. Ask for a margin between scores"><h1>Ask for a margin between scores</h1><div class="content"><p>The correct class <m>y_i</m> should beat every other class by at least <m>\Delta</m>.</p><m display="true">s_{y_i} \ge s_j+\Delta\qquad\text{for every }j\ne y_i</m><div class="margin-bars"><figure class=""><img src="assets/score-margin.svg" alt="Cat score 3.2, car 5.1, frog minus 1.7; wrong-class threshold 2.2"></figure></div><div class="step" data-stage="1"><p class="callout">Set <m>\Delta=1</m>. The car score must be at most <m>3.2-1=2.2</m>.</p></div></div><footer><span><a href="https://cs231n.github.io/linear-classify/" target="_blank" rel="noopener">CS231n · course notes</a></span><span>Loss and SVM</span><span>05 / TOTAL</span></footer></section>
