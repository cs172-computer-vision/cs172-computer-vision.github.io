<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 350" role="img" aria-label="An original two-block CNN with global averaging and a ten-class linear head"><title>An original two-block CNN with global averaging and a ten-class linear head</title><rect x="2" y="75" width="181" height="145" fill="#f5f8fc" stroke="#b9c9dd" stroke-width="2"/><text x="92" y="124" font-family="Arial,Helvetica,sans-serif" font-size="25" fill="#14243c" text-anchor="middle">Input</text><text x="92" y="176" font-family="Arial,Helvetica,sans-serif" font-size="24" fill="#236bc2" text-anchor="middle">3 × 32 × 32</text><path d="M186,148 L202,148" fill="none" stroke="#53657e" stroke-width="2"/><path d="M193,142 L202,148 L193,154" fill="none" stroke="#53657e" stroke-width="2"/><rect x="204" y="75" width="181" height="145" fill="#f5f8fc" stroke="#b9c9dd" stroke-width="2"/><text x="294" y="124" font-family="Arial,Helvetica,sans-serif" font-size="25" fill="#14243c" text-anchor="middle">Conv + ReLU</text><text x="294" y="176" font-family="Arial,Helvetica,sans-serif" font-size="24" fill="#236bc2" text-anchor="middle">8 × 32 × 32</text><path d="M388,148 L404,148" fill="none" stroke="#53657e" stroke-width="2"/><path d="M395,142 L404,148 L395,154" fill="none" stroke="#53657e" stroke-width="2"/><rect x="406" y="75" width="181" height="145" fill="#f5f8fc" stroke="#b9c9dd" stroke-width="2"/><text x="496" y="124" font-family="Arial,Helvetica,sans-serif" font-size="25" fill="#14243c" text-anchor="middle">Max pool</text><text x="496" y="176" font-family="Arial,Helvetica,sans-serif" font-size="24" fill="#236bc2" text-anchor="middle">8 × 16 × 16</text><path d="M590,148 L606,148" fill="none" stroke="#53657e" stroke-width="2"/><path d="M597,142 L606,148 L597,154" fill="none" stroke="#53657e" stroke-width="2"/><rect x="608" y="75" width="181" height="145" fill="#f5f8fc" stroke="#b9c9dd" stroke-width="2"/><text x="698" y="124" font-family="Arial,Helvetica,sans-serif" font-size="25" fill="#14243c" text-anchor="middle">Conv + ReLU</text><text x="698" y="176" font-family="Arial,Helvetica,sans-serif" font-size="24" fill="#236bc2" text-anchor="middle">16 × 16 × 16</text><path d="M792,148 L808,148" fill="none" stroke="#53657e" stroke-width="2"/><path d="M799,142 L808,148 L799,154" fill="none" stroke="#53657e" stroke-width="2"/><rect x="810" y="75" width="181" height="145" fill="#f5f8fc" stroke="#b9c9dd" stroke-width="2"/><text x="900" y="124" font-family="Arial,Helvetica,sans-serif" font-size="25" fill="#14243c" text-anchor="middle">Max pool</text><text x="900" y="176" font-family="Arial,Helvetica,sans-serif" font-size="24" fill="#236bc2" text-anchor="middle">16 × 8 × 8</text><path d="M994,148 L1010,148" fill="none" stroke="#53657e" stroke-width="2"/><path d="M1001,142 L1010,148 L1001,154" fill="none" stroke="#53657e" stroke-width="2"/><rect x="1012" y="75" width="181" height="145" fill="#e2f2ec" stroke="#b9c9dd" stroke-width="2"/><text x="1102" y="124" font-family="Arial,Helvetica,sans-serif" font-size="25" fill="#14243c" text-anchor="middle">Avg → Linear</text><text x="1102" y="176" font-family="Arial,Helvetica,sans-serif" font-size="24" fill="#236bc2" text-anchor="middle">16 → 10</text><text x="600" y="290" font-family="Arial,Helvetica,sans-serif" font-size="28" fill="#53657e" text-anchor="middle">Convolution: K = 3, S = 1, P = 1 · Max pool: K = 2, S = 2</text></svg>