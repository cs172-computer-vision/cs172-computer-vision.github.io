<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
  <defs>
    <style>
      .axis { stroke: #444; stroke-width: 3; }
      .grid { stroke: #e8e8e8; stroke-width: 1; }
      .point { fill: #111827; }
      .lineA { stroke: #2563eb; stroke-width: 5; }
      .lineB { stroke: #dc2626; stroke-width: 5; }
      .lineC { stroke: #16a34a; stroke-width: 5; }
      .tagText { font: 700 30px Arial, sans-serif; dominant-baseline: middle; text-anchor: middle; }
      .axisLabel { font: 600 30px Arial, sans-serif; fill: #333; }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#555"/>
    </marker>
  </defs>

  <!-- <rect width="1200" height="700" fill="white"/> -->

  <g transform="translate(100,100)">
    <!-- grid -->
    <g>
      <line x1="90" y1="50" x2="90" y2="450" class="grid"/>
      <line x1="210" y1="50" x2="210" y2="450" class="grid"/>
      <line x1="330" y1="50" x2="330" y2="450" class="grid"/>
      <line x1="450" y1="50" x2="450" y2="450" class="grid"/>
      <line x1="570" y1="50" x2="570" y2="450" class="grid"/>
      <line x1="690" y1="50" x2="690" y2="450" class="grid"/>
      <line x1="810" y1="50" x2="810" y2="450" class="grid"/>

      <line x1="90" y1="450" x2="810" y2="450" class="grid"/>
      <line x1="90" y1="370" x2="810" y2="370" class="grid"/>
      <line x1="90" y1="290" x2="810" y2="290" class="grid"/>
      <line x1="90" y1="210" x2="810" y2="210" class="grid"/>
      <line x1="90" y1="130" x2="810" y2="130" class="grid"/>
      <line x1="90" y1="50" x2="810" y2="50" class="grid"/>
    </g>

    <!-- axes -->
    <line x1="90" y1="450" x2="850" y2="450" class="axis" marker-end="url(#arrow)"/>
    <line x1="90" y1="470" x2="90" y2="20" class="axis" marker-end="url(#arrow)"/>

    <text x="862" y="458" class="axisLabel">x</text>
    <text x="60" y="28" class="axisLabel">y</text>

    <!-- points -->
    <g>
      <circle cx="136" cy="382" r="6" class="point"/>
      <circle cx="174" cy="360" r="6" class="point"/>
      <circle cx="212" cy="352" r="6" class="point"/>
      <circle cx="240" cy="314" r="6" class="point"/>
      <circle cx="272" cy="306" r="6" class="point"/>
      <circle cx="312" cy="276" r="6" class="point"/>
      <circle cx="343" cy="262" r="6" class="point"/>
      <circle cx="377" cy="240" r="6" class="point"/>
      <circle cx="419" cy="214" r="6" class="point"/>
      <circle cx="450" cy="204" r="6" class="point"/>
      <circle cx="492" cy="176" r="6" class="point"/>
      <circle cx="530" cy="148" r="6" class="point"/>
      <circle cx="566" cy="143" r="6" class="point"/>
      <circle cx="601" cy="108" r="6" class="point"/>
      <circle cx="638" cy="94" r="6" class="point"/>
      <circle cx="674" cy="82" r="6" class="point"/>
      <circle cx="712" cy="60" r="6" class="point"/>
      <circle cx="750" cy="52" r="6" class="point"/>
    </g>

    <!-- candidate lines -->
    <line x1="120" y1="412" x2="780" y2="58" class="lineA"/>
    <line x1="120" y1="320" x2="780" y2="195" class="lineB"/>
    <line x1="120" y1="446" x2="780" y2="128" class="lineC"/>

    <!-- labels -->
    <g>
      <circle cx="792" cy="56" r="24" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
      <text x="792" y="58" class="tagText" fill="#2563eb">A</text>

      <circle cx="798" cy="194" r="24" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
      <text x="798" y="196" class="tagText" fill="#dc2626">B</text>

      <circle cx="800" cy="128" r="24" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
      <text x="800" y="130" class="tagText" fill="#16a34a">C</text>
    </g>
  </g>
</svg>